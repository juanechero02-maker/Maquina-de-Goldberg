<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Máquina de Goldberg 3D – 6 Máquinas Simples</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#1a1a2e;font-family:'Segoe UI',system-ui,sans-serif;color:#e8e4d8;overflow:hidden;}
  #ui{position:fixed;top:0;left:0;right:0;z-index:10;background:rgba(20,18,30,0.92);backdrop-filter:blur(8px);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid rgba(255,255,255,0.08);}
  #ui h1{font-size:13px;font-weight:600;color:#c8b8f0;letter-spacing:.5px;margin-right:4px;}
  button{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#e8e4d8;padding:5px 13px;border-radius:6px;font-size:12px;cursor:pointer;transition:background .15s;}
  button:hover{background:rgba(255,255,255,0.18);}
  button.active{background:rgba(144,96,208,0.4);border-color:#9060d0;}
  #stage-info{margin-left:auto;font-size:12px;color:#b0a8e0;min-width:220px;text-align:right;}
  #tags{position:fixed;bottom:10px;left:10px;z-index:10;display:flex;flex-wrap:wrap;gap:5px;max-width:680px;}
  .tag{font-size:11px;padding:3px 9px;border-radius:4px;font-weight:500;}
  canvas{display:block;width:100vw;height:100vh;}
  #progress{position:fixed;bottom:10px;right:10px;z-index:10;display:flex;gap:6px;}
  .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);transition:background .3s;}
  .dot.active{background:#9060d0;}
  .dot.done{background:#3a9e5f;}
  #layout-hint{position:fixed;top:50px;right:10px;z-index:10;font-size:10px;color:rgba(255,255,255,0.3);text-align:right;line-height:1.6;}
</style>
</head>
<body>
<div id="ui">
  <h1>🎯 MÁQUINA DE GOLDBERG</h1>
  <button onclick="resetCamera()">↺ Reset cámara</button>
  <button onclick="downloadPage()" style="background:rgba(60,120,60,0.4);border-color:#3a7a3a;">⬇ Descargar HTML</button>
  <span style="font-size:11px;color:rgba(255,255,255,0.35);margin-left:4px">Arrastra · Scroll para zoom · Explora las máquinas simples</span>
</div>

<div id="tags">
  <span class="tag" style="background:#1e3a5f;color:#6eb3f7">① Plano inclinado</span>
  <span class="tag" style="background:#5f1e1e;color:#f76e6e">② Palanca</span>
  <span class="tag" style="background:#1e4a2e;color:#6ef7a0">③ Polea</span>
  <span class="tag" style="background:#4a3a00;color:#f7d06e">④ Tornillo helicoidal</span>
  <span class="tag" style="background:#1e3a5f;color:#6eb3f7">⑤ Plano inclinado</span>
  <span class="tag" style="background:#3a1e5f;color:#c06ef7">⑥ Catapulta</span>
  <span class="tag" style="background:#3a2a10;color:#f7a06e">🏀 Canasta</span>
</div>

<div id="layout-hint">
  FILA TRASERA (z−): ① → ② → ③<br>
  FILA DELANTERA (z+): ④ → ⑤ → ⑥ → 🏀
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════
//  RENDERER SETUP
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

window.addEventListener('resize',()=>{
  renderer.setSize(window.innerWidth,window.innerHeight);
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});

// ═══════════════════════════════════════════════════════════
//  SCENE & CAMERA  — centrado en el layout en U
// ═══════════════════════════════════════════════════════════
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12101e);
scene.fog = new THREE.FogExp2(0x12101e, 0.016);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 300);
// Vista cenital ligeramente inclinada sobre el layout en U
let theta = 0.0, phi = 0.52, radius = 32;
const camTarget = new THREE.Vector3(-1, 2, 0);

function updateCamera(){
  camera.position.x = camTarget.x + radius * Math.sin(phi) * Math.sin(theta);
  camera.position.y = camTarget.y + radius * Math.cos(phi);
  camera.position.z = camTarget.z + radius * Math.sin(phi) * Math.cos(theta);
  camera.lookAt(camTarget);
}
updateCamera();

// ═══════════════════════════════════════════════════════════
//  LIGHTS
// ═══════════════════════════════════════════════════════════
scene.add(new THREE.AmbientLight(0x8890bb, 0.55));

const sun = new THREE.DirectionalLight(0xfffbe8, 1.1);
sun.position.set(6, 22, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left   = -22;
sun.shadow.camera.right  =  16;
sun.shadow.camera.top    =  25;
sun.shadow.camera.bottom =  -8;
sun.shadow.bias = -0.001;
scene.add(sun);

const fillLight = new THREE.DirectionalLight(0x6688cc, 0.3);
fillLight.position.set(-8, 6, -6);
scene.add(fillLight);

const pointLight = new THREE.PointLight(0xf0a050, 0.4, 20);
pointLight.position.set(-8, 5, 2);
scene.add(pointLight);

// ═══════════════════════════════════════════════════════════
//  MATERIALS
// ═══════════════════════════════════════════════════════════
const M = {
  wood:  new THREE.MeshLambertMaterial({color:0xc08040}),
  dwood: new THREE.MeshLambertMaterial({color:0x7a4a20}),
  plank: new THREE.MeshLambertMaterial({color:0xd4a060}),
  ball:  new THREE.MeshPhongMaterial({color:0xd0d0d8, shininess:160, specular:0xaaaacc}),
  ball2: new THREE.MeshPhongMaterial({color:0xc8c090, shininess:120, specular:0x999966}),
  blue:  new THREE.MeshLambertMaterial({color:0x2255bb}),
  red:   new THREE.MeshLambertMaterial({color:0xbb2222}),
  green: new THREE.MeshLambertMaterial({color:0x228844}),
  yellow:new THREE.MeshLambertMaterial({color:0xddaa00}),
  purple:new THREE.MeshLambertMaterial({color:0x8840cc}),
  orange:new THREE.MeshLambertMaterial({color:0xdd6600}),
  rope:  new THREE.MeshLambertMaterial({color:0xd4b070}),
  wheel: new THREE.MeshLambertMaterial({color:0x222233}),
  floor: new THREE.MeshLambertMaterial({color:0x1e1c2a}),
  grid:  new THREE.MeshLambertMaterial({color:0x2a2838,wireframe:false}),
};

// ═══════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════
function box(w,h,d,mat,x,y,z,rx=0,ry=0,rz=0,castS=true){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); m.rotation.set(rx,ry,rz);
  if(castS) m.castShadow=true; m.receiveShadow=true;
  scene.add(m); return m;
}
function cyl(rt,rb,h,seg,mat,x,y,z,rx=0,ry=0,rz=0){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);
  m.position.set(x,y,z); m.rotation.set(rx,ry,rz);
  m.castShadow=true; m.receiveShadow=true;
  scene.add(m); return m;
}
function sphere(r,mat,x,y,z){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,28,28),mat);
  m.position.set(x,y,z); m.castShadow=true; scene.add(m); return m;
}

// ═══════════════════════════════════════════════════════════
//  FLOOR GRID — cubre el layout en U
//  X: -14 … +11   Z: -6 … +6
// ═══════════════════════════════════════════════════════════
const floorGeo = new THREE.PlaneGeometry(32, 16, 32, 16);
const floor = new THREE.Mesh(floorGeo, M.floor);
floor.rotation.x = -Math.PI/2;
floor.position.set(-1.5, -0.02, 0);
floor.receiveShadow = true;
scene.add(floor);
const grid = new THREE.GridHelper(32, 32, 0x3a3650, 0x2a2838);
grid.position.set(-1.5, 0.01, 0);
scene.add(grid);

// ── Líneas guía que muestran el recorrido en U ──────────────
const arrowMat = new THREE.MeshLambertMaterial({color:0x4a3a6a});
// Fila trasera (z = -3.5): flecha →
box(9.0, 0.05, 0.08, arrowMat, -4.5, 0.03, -3.5);
// Conexión entre filas (x = 8.5):  flecha ↓
box(0.08, 0.05, 6.5, arrowMat, 8.5, 0.03, 0);
// Fila delantera (z = +3.5): flecha ←
box(17.0, 0.05, 0.08, arrowMat, -0.5, 0.03, 3.5);


// ═══════════════════════════════════════════════════════════
//  1. PLANO INCLINADO 1   — FILA TRASERA, extremo izquierdo
//     Centro: x ≈ -10,  z = -3.5
// ═══════════════════════════════════════════════════════════
const R1 = {
  baseH: 2.0,
  baseL: 5.0,
  depth: 1.6,
};
R1.angle = Math.atan2(R1.baseH, R1.baseL);
const r1HypoLen = Math.sqrt(R1.baseH**2 + R1.baseL**2);
const r1cx = -10.0, r1cz = -3.5;

box(0.25, R1.baseH*2, R1.depth, M.dwood, r1cx-R1.baseL/2, R1.baseH, r1cz);
box(r1HypoLen+0.1, 0.22, R1.depth, M.wood,
  r1cx, R1.baseH, r1cz, 0, 0, -R1.angle);
box(R1.baseL+0.3, 0.18, R1.depth, M.dwood, r1cx, 0.09, r1cz);
box(r1HypoLen+0.1, 0.08, R1.depth+0.05, M.blue,
  r1cx, R1.baseH+0.12, r1cz, 0, 0, -R1.angle);
box(0.25, 0.18, R1.depth, M.dwood, r1cx+R1.baseL/2, 0.09, r1cz);

// ═══════════════════════════════════════════════════════════
//  2. PALANCA   — FILA TRASERA, centro
//     Centro fulcro: x ≈ -3.5,  z = -3.5
// ═══════════════════════════════════════════════════════════
const levX = -3.5, levZ = -3.5;
const fulcrum = new THREE.Group();
scene.add(fulcrum);
fulcrum.position.set(levX, 0, levZ);
const coneM=new THREE.Mesh(new THREE.ConeGeometry(0.45,1.1,4),M.dwood);
coneM.position.set(0,0.55,0); coneM.rotation.y=Math.PI/4; coneM.castShadow=true;
fulcrum.add(coneM);
const baseRect=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.18,1.2),M.dwood);
baseRect.position.set(0,0.09,0); baseRect.castShadow=true; fulcrum.add(baseRect);

const leverGroup = new THREE.Group();
leverGroup.position.set(levX, 1.18, levZ);
scene.add(leverGroup);
const leverArm = new THREE.Mesh(new THREE.BoxGeometry(7.0,0.22,0.5), M.plank);
leverArm.position.set(0.9, 0, 0); leverArm.castShadow=true; leverGroup.add(leverArm);
const levStrip=new THREE.Mesh(new THREE.BoxGeometry(7.0,0.1,0.55),M.red);
levStrip.position.set(0.9,0.12,0); leverGroup.add(levStrip);
const leverBallL = new THREE.Mesh(new THREE.SphereGeometry(0.32,20,20),M.ball2);
leverBallL.position.set(-2.65,0.32,0); leverBallL.castShadow=true; leverGroup.add(leverBallL);
let leverAngle = 0;

// ═══════════════════════════════════════════════════════════
//  3. POLEA   — FILA TRASERA, extremo derecho
//     Centro: x ≈ 4,  z = -3.5
// ═══════════════════════════════════════════════════════════
const polX = 4.0, polZ = -3.5;
box(0.28,5.5,0.28,M.dwood, polX,2.75, polZ);
box(1.2,0.22,0.22,M.dwood, polX,5.6,  polZ);
const pulleyWheel = cyl(0.75,0.75,0.22,32,M.green, polX,5.72, polZ, Math.PI/2,0,0);
cyl(0.08,0.08,1.4,8,new THREE.MeshLambertMaterial({color:0xf7d060}), polX,5.72, polZ, Math.PI/2,0,0);
box(2.0,0.18,1.4,M.dwood, polX,0.09, polZ);
const ropeL = box(0.07,4.5,0.07,M.rope, polX-0.38,3.0, polZ);
const pulleyPlatform = new THREE.Group();
scene.add(pulleyPlatform);
pulleyPlatform.position.set(polX-0.38, 1.1, polZ);
const platBoard=new THREE.Mesh(new THREE.BoxGeometry(1.0,0.18,0.9),M.wood);
platBoard.castShadow=true; pulleyPlatform.add(platBoard);
const platStrip=new THREE.Mesh(new THREE.BoxGeometry(1.0,0.08,0.95),M.green);
platStrip.position.y=0.11; pulleyPlatform.add(platStrip);
const ropeR = box(0.07,4.5,0.07,M.rope, polX+0.38,3.0, polZ);
const counterWeight=new THREE.Group();
scene.add(counterWeight);
counterWeight.position.set(polX+0.38,1.6, polZ);
const cwBox=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.55,0.55),new THREE.MeshLambertMaterial({color:0x667788}));
cwBox.castShadow=true; counterWeight.add(cwBox);

let pulleyPlatformY = 1.1;

// ═══════════════════════════════════════════════════════════
//  4. TORNILLO HELICOIDAL — FILA DELANTERA, extremo derecho
//     Centro: x ≈ 8,  z = +3.5
// ═══════════════════════════════════════════════════════════
// Tornillo en el punto medio entre la polea (4, -3.5) y el plano inclinado 2 (1.5, +3.5)
const screwX = 2.75, screwZ = 0.0;
const SCREW_TURNS  = 3.5;
const SCREW_RADIUS = 0.85;
const SCREW_TOP_Y  = 3.6;
const SCREW_BOT_Y  = 0.36;
const SCREW_SEGS   = 120;

// Eje central
cyl(0.07, 0.07, (SCREW_TOP_Y - SCREW_BOT_Y) + 0.5,
    12, M.dwood, screwX, (SCREW_TOP_Y + SCREW_BOT_Y) / 2, screwZ);
// Base
cyl(0.45, 0.6, 0.22, 16, M.dwood, screwX, 0.11, screwZ);
// Tope superior
cyl(0.18, 0.18, 0.28, 12, M.yellow, screwX, SCREW_TOP_Y + 0.14, screwZ);

// Puntos de la hélice (ahora centrados en screwX, screwZ)
const helixPoints = [];
for (let i = 0; i <= SCREW_SEGS; i++) {
  const t = i / SCREW_SEGS;
  const angle = t * SCREW_TURNS * Math.PI * 2;
  helixPoints.push(new THREE.Vector3(
    screwX + SCREW_RADIUS * Math.cos(angle),
    SCREW_TOP_Y - t * (SCREW_TOP_Y - SCREW_BOT_Y),
    screwZ + SCREW_RADIUS * Math.sin(angle)   // ← Z desplazado
  ));
}

// Rampa helicoidal
const rampMat  = new THREE.MeshLambertMaterial({color:0xd4a060});
const railMat  = new THREE.MeshLambertMaterial({color:0xf7c030});
for (let i = 0; i < SCREW_SEGS; i++) {
  const p0 = helixPoints[i], p1 = helixPoints[i+1];
  const mid = new THREE.Vector3().addVectors(p0,p1).multiplyScalar(0.5);
  const dir = new THREE.Vector3().subVectors(p1,p0);
  const len = dir.length();
  const quat = new THREE.Quaternion().setFromUnitVectors(
    new THREE.Vector3(1,0,0), dir.clone().normalize());

  const seg = new THREE.Mesh(new THREE.BoxGeometry(len+0.01, 0.07, 0.42), rampMat);
  seg.quaternion.copy(quat);
  seg.position.copy(mid);
  seg.castShadow = true; seg.receiveShadow = true;
  scene.add(seg);

  if (i % 3 === 0) {
    const t = i / SCREW_SEGS;
    const angle = t * SCREW_TURNS * Math.PI * 2;
    const outDir = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle)).multiplyScalar(0.2);
    const rail = new THREE.Mesh(new THREE.BoxGeometry(len*3.2, 0.05, 0.05), railMat);
    rail.quaternion.copy(quat);
    rail.position.copy(mid).add(outDir);
    rail.position.y += 0.12;
    rail.castShadow = true;
    scene.add(rail);
  }
}

// Canica en la entrada del tornillo
const cartBall = sphere(0.28, M.ball, helixPoints[0].x, helixPoints[0].y + 0.28, helixPoints[0].z);
let screwT = 0;
let screwRunning = false;

// ═══════════════════════════════════════════════════════════
//  5. PLANO INCLINADO 2   — FILA DELANTERA, centro
//     Centro: x ≈ 1.5,  z = +3.5
// ═══════════════════════════════════════════════════════════
const R2 = {
  baseH: 1.6,
  baseL: 4.2,
  depth: 1.6,
};
R2.angle = Math.atan2(R2.baseH, R2.baseL);
const r2HypoLen = Math.sqrt(R2.baseH**2 + R2.baseL**2);
const r2cx = 1.5, r2cz = 3.5;

// Poste alto a la DERECHA — rampa desciende hacia la IZQUIERDA (→ catapulta)
box(0.25, R2.baseH*2, R2.depth, M.dwood, r2cx+R2.baseL/2, R2.baseH, r2cz);
box(r2HypoLen+0.1, 0.22, R2.depth, M.wood,
  r2cx, R2.baseH, r2cz, 0, 0, R2.angle);
box(R2.baseL+0.3, 0.18, R2.depth, M.dwood, r2cx, 0.09, r2cz);
box(r2HypoLen+0.1, 0.08, R2.depth+0.05, M.blue,
  r2cx, R2.baseH+0.12, r2cz, 0, 0, R2.angle);
box(0.25, 0.18, R2.depth, M.dwood, r2cx-R2.baseL/2, 0.09, r2cz);

// Bola estática en la parte alta del plano 2 (extremo derecho = lado alto)
const ramp2Ball = sphere(0.32, M.ball2, r2cx+R2.baseL/2-0.4, R2.baseH*2+0.32, r2cz);

// ═══════════════════════════════════════════════════════════
//  6. CATAPULTA   — FILA DELANTERA, centro-izquierda
//     Centro: x ≈ -5,  z = +3.5
// ═══════════════════════════════════════════════════════════
const catX = -5.0, catZ = 3.5;
box(2.8,0.18,1.8, M.dwood, catX,0.09, catZ);
const catMat2=new THREE.MeshLambertMaterial({color:0xb87030});
[[-0.5,0.5],[0.5,-0.5]].forEach(([z1,z2])=>{
  box(0.16,2.6,0.28,catMat2, catX-0.5,1.2, catZ+z1, 0,0, 0.38);
  box(0.16,2.6,0.28,catMat2, catX+0.5,1.2, catZ+z1, 0,0,-0.38);
  box(0.16,2.6,0.28,catMat2, catX-0.5,1.2, catZ+z2, 0,0, 0.38);
  box(0.16,2.6,0.28,catMat2, catX+0.5,1.2, catZ+z2, 0,0,-0.38);
});
box(0.18,0.18,2.0, M.dwood, catX,2.3, catZ);

const catArmGroup = new THREE.Group();
catArmGroup.position.set(catX, 2.3, catZ);
scene.add(catArmGroup);
// Brazo invertido: copa en extremo IZQUIERDO → dispara hacia la CANASTA (x negativo)
const catArm=new THREE.Mesh(new THREE.BoxGeometry(4.2,0.18,0.28),M.plank);
catArm.position.set(-0.6,0,0); catArm.castShadow=true; catArmGroup.add(catArm);
const catCup=new THREE.Mesh(new THREE.SphereGeometry(0.32,16,16,0,Math.PI*2,0,Math.PI/2),M.green);
catCup.position.set(-2.8,0.16,0); catCup.castShadow=true; catArmGroup.add(catCup);  // copa a la IZQUIERDA
const catCW=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5),
  new THREE.MeshLambertMaterial({color:0x556677}));
catCW.position.set(1.4,0.3,0); catCW.castShadow=true; catArmGroup.add(catCW);  // contrapeso a la DERECHA
box(2.8,0.08,1.85, M.purple, catX,0.2, catZ);

// Ángulo +0.9 rad (antihorario) → extremo izquierdo (copa) apunta ABAJO = posición cargada
let catArmAngle = 0.9;
catArmGroup.rotation.z = catArmAngle;

// Bola cargada en la copa (cerca del suelo, a la izquierda del pivote)
const catapultBall = sphere(0.3, M.ball,
  catX - 2.8*Math.cos(catArmAngle),
  2.3 - 2.8*Math.sin(catArmAngle) + 0.3,
  catZ);

// ═══════════════════════════════════════════════════════════
//  7. CANASTA / ARO   — FILA DELANTERA, extremo izquierdo
//     Centro: x ≈ -11,  z = +3.5
// ═══════════════════════════════════════════════════════════
const baskX = -11.0, baskZ = 3.5;
// Tablero girado 90° → enfrenta hacia la DERECHA (+x = dirección de la catapulta)
box(0.18,5.5,0.18, M.dwood, baskX,2.75, baskZ);
box(0.1,1.9,2.4, new THREE.MeshLambertMaterial({color:0xd8d0b8}), baskX+0.1,4.7, baskZ);  // panel de fondo
box(0.1,0.1,2.4, M.dwood, baskX+0.1,3.75, baskZ);   // borde inferior
box(0.1,0.1,2.4, M.dwood, baskX+0.1,5.65, baskZ);   // borde superior
box(0.1,1.9,0.1, M.dwood, baskX+0.1,4.7, baskZ-1.2); // borde trasero
box(0.1,1.9,0.1, M.dwood, baskX+0.1,4.7, baskZ+1.2); // borde delantero
// Brazo soporte apuntando hacia la catapulta (+x)
box(1.0,0.12,0.12, M.dwood, baskX+0.6,4.3, baskZ);
const rimGeo=new THREE.TorusGeometry(0.72,0.07,12,40);
const rimMesh=new THREE.Mesh(rimGeo,M.orange);

// ═══════════════════════════════════════════════════════════
//  ORBIT CONTROLS
// ═══════════════════════════════════════════════════════════
let isDragging=false, prevMx=0, prevMy=0;

canvas.addEventListener('mousedown',e=>{isDragging=true;prevMx=e.clientX;prevMy=e.clientY;canvas.style.cursor='grabbing';});
window.addEventListener('mouseup',()=>{isDragging=false;canvas.style.cursor='default';});
window.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  theta-=(e.clientX-prevMx)*0.007;
  phi=Math.max(0.12,Math.min(1.45,phi-(e.clientY-prevMy)*0.006));
  prevMx=e.clientX; prevMy=e.clientY;
  updateCamera();
});
canvas.addEventListener('wheel',e=>{
  radius=Math.max(8,Math.min(60,radius+e.deltaY*0.04));
  updateCamera(); e.preventDefault();
},{passive:false});
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1){isDragging=true;prevMx=e.touches[0].clientX;prevMy=e.touches[0].clientY;}
},{passive:true});
canvas.addEventListener('touchend',()=>isDragging=false,{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(!isDragging||e.touches.length!==1)return;
  theta-=(e.touches[0].clientX-prevMx)*0.007;
  phi=Math.max(0.12,Math.min(1.45,phi-(e.touches[0].clientY-prevMy)*0.006));
  prevMx=e.touches[0].clientX; prevMy=e.touches[0].clientY;
  updateCamera();
},{passive:true});

function downloadPage(){
  const html = document.documentElement.outerHTML;
  const blob = new Blob([html], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'maquina_goldberg.html';
  a.click();
}


function resetCamera(){
  theta = 0.0; phi = 0.52; radius = 32;
  camTarget.set(-1, 2, 0);
  updateCamera();
}
